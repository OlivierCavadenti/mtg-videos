name: Update and publish

# Every hour: read the creators' feeds, commit the new videos, publish the page on GitHub Pages.
# Once a day (06:23 UTC) the sets and cards are read from Scryfall as well. A push to main reads
# the feeds too, so that the time of the last update shown on the page is always true.
on:
  schedule:
    - cron: "23 6 * * *"
    - cron: "23 0-5,7-23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read the creators' feeds
        env:
          # Optional: with a YouTube Data API key, durations come with each new video.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "23 6 * * *" ]; then
            npm run sets || echo "Scryfall unavailable: the sets stay as they were"
            npm run cards || echo "Scryfall unavailable: the cards stay as they were"
          fi
          npm run sync
          npm run views

      - name: Commit the new videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Data: videos of $(date -u '+%F %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
